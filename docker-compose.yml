services:
  redis-engines:
    image: redis:8.2
    container_name: redis-engines-demo
    ports:
      - "16421:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxclients", "10000"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 15

